name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test core logic
        run: dotnet test tests/KackZug.Core.Tests/KackZug.Core.Tests.csproj

      - name: Build desktop head
        run: dotnet build src/KackZug.Desktop/KackZug.Desktop.csproj

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install Android SDK platform
        run: dotnet build src/KackZug.Android/KackZug.Android.csproj -t:InstallAndroidDependencies -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true

      - name: Build APK
        run: dotnet build src/KackZug.Android/KackZug.Android.csproj -c Release -p:AndroidSdkDirectory="$ANDROID_HOME"
