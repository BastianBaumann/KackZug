name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    # signing secrets live in this environment, which only accepts v* tags
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stable releases only from main
        run: |
          case "$GITHUB_REF_NAME" in *-*) exit 0 ;; esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Stable tag $GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: 17

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install Android SDK platform
        run: dotnet build src/KackZug.Android/KackZug.Android.csproj -t:InstallAndroidDependencies -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true

      - name: Test core logic
        run: dotnet test tests/KackZug.Core.Tests/KackZug.Core.Tests.csproj

      - name: Work out version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # versionCode: minutes since 2026-01-01 UTC, so every release installs as an update
          CODE=$(( ( $(date +%s) - 1767225600 ) / 60 ))
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CODE=$CODE" >> "$GITHUB_ENV"

      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kackzug-release.keystore"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          dotnet publish src/KackZug.Android/KackZug.Android.csproj -c Release -f net10.0-android -o out
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:Version="${VERSION%%-*}"
          -p:ApplicationDisplayVersion="$VERSION"
          -p:ApplicationVersion="$CODE"
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/kackzug-release.keystore"
          -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
          -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
          -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/*-Signed.apk "KackZug-$VERSION.apk"
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "KackZug-$VERSION.apk" --title "KackZug $VERSION" --generate-notes $PRERELEASE

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/kackzug-release.keystore"
